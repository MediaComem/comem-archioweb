name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ansible-lint
        # Keep this version in sync with the one used locally.
        run: pip install ansible-lint==26.8.0

      - name: Install the required Ansible collections
        run: ansible-galaxy collection install -r vm/requirements.yml

      - name: Stand in for the private files
        # ansible-lint runs `ansible-playbook --syntax-check` under the hood,
        # which loads `vm/vars/secrets.vault`. That file is encrypted and its
        # password is not available in CI, so replace it with the plaintext
        # sample, which declares the same variables. The dummy password file is
        # never used to decrypt anything, but `ansible.cfg` points at it
        # unconditionally and Ansible fails if it does not exist.
        run: |
          cp vm/vars/secrets.sample.yml vm/vars/secrets.vault
          echo 'not-a-real-password' > .vault-password

      - name: Run ansible-lint
        run: ansible-lint vm/playbook.yml --offline

  livecodes:
    name: Exercise playground links
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Check that the "Open in LiveCodes" links match the exercises
        # The links carry the code of each exercise in the URL, so they go stale
        # as soon as the code block above them is edited. The script has no
        # dependencies, so there is nothing to install here.
        run: npm run livecodes:check

  express-starter:
    name: Express starter (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version that fails, not just the first one.
      fail-fast: false
      matrix:
        # The Node.js versions that have not reached their end of life. Keep
        # this in sync with the "engines" field of the starter's package.json.
        node-version: [22, 24, 26]
    defaults:
      run:
        working-directory: subjects/express/starter
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: subjects/express/starter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check that the application starts and responds
        # Students copy this directory with degit as the starting point of their
        # Express application, so it must work as-is on every Node.js version
        # they might have installed.
        run: |
          npm start &
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://localhost:3000
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/not-found)" = 404

  doctoc:
    name: Tables of contents
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update the tables of contents
        run: npm run doctoc

      - name: Check that the tables of contents are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git diff
            echo "::error::The tables of contents are out of date. Run 'npm run doctoc' and commit the result."
            exit 1
          fi
