<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="970" height="540" viewBox="0 0 970 540" fill="#000">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#000"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Participants -->
  <rect x="158" y="8" width="140" height="60" fill="#628dc6" stroke="#3a5f94"/>
  <text x="228" y="34" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" text-anchor="middle">Client</text>
  <text x="228" y="55" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" text-anchor="middle">(App, Postman)</text>
  <rect x="640" y="8" width="140" height="60" fill="#66bb33" stroke="#3f8a1a"/>
  <text x="710" y="34" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" text-anchor="middle">Server</text>
  <text x="710" y="55" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" text-anchor="middle">(API)</text>
  <line x1="228" y1="68" x2="228" y2="532" stroke="#000" stroke-dasharray="2,3"/>
  <line x1="710" y1="68" x2="710" y2="532" stroke="#000" stroke-dasharray="2,3"/>
  <rect x="218" y="90" width="20" height="420" fill="#a3b8e0" stroke="#3a5f94"/>

  <!-- Trigger -->
  <circle cx="34" cy="141" r="5"/>
  <line x1="34" y1="141" x2="218" y2="141" stroke="#000" marker-end="url(#head)"/>
  <text x="42" y="111" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16">Log in and perform</text>
  <text x="42" y="131" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16">sensitive operations</text>
  <text x="250.0" y="138" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve">Log in (send name/password)</text>
  <line x1="238" y1="152" x2="700" y2="152" stroke="#000" marker-end="url(#head)"/>
  <rect x="700" y="152" width="20" height="86" fill="#b6dc9a" stroke="#3f8a1a"/>
  <text x="481.0" y="210" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve">Receive JWT from server</text>
  <line x1="700" y1="224" x2="238" y2="224" stroke="#000" marker-end="url(#head)"/>
  <text x="250.0" y="282" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve">Do stuff (send JWT to authenticate)</text>
  <line x1="238" y1="296" x2="700" y2="296" stroke="#000" marker-end="url(#head)"/>
  <rect x="700" y="296" width="20" height="86" fill="#b6dc9a" stroke="#3f8a1a"/>
  <text x="670.0" y="354" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve">OK</text>
  <line x1="700" y1="368" x2="238" y2="368" stroke="#000" marker-end="url(#head)"/>
  <text x="250.0" y="426" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve">Do more stuff (send JWT to authenticate)</text>
  <line x1="238" y1="440" x2="700" y2="440" stroke="#000" marker-end="url(#head)"/>
  <rect x="700" y="440" width="20" height="70" fill="#b6dc9a" stroke="#3f8a1a"/>
  <text x="469" y="498" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="28" text-anchor="middle">. . .</text>
</svg>
