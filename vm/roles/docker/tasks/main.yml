---
- name: Install Docker dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present

- name: Create the APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    owner: root
    group: root
    mode: '0755'
    state: directory

- name: Add Docker APT repository key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    # The key must be world-readable, otherwise the unprivileged _apt user
    # cannot verify the repository's signature.
    mode: '0644'
  register: docker_apt_key

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
  register: docker_apt_repository

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
  when: docker_apt_key is changed or docker_apt_repository is changed

- name: Install Docker
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present

- name: Make sure Docker works
  ansible.builtin.command: docker run --rm hello-world
  changed_when: false
