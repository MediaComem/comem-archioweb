<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#000">
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#000"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>

<!-- Boxes -->
<rect x="20" y="40" width="170" height="80" fill="#ffff99" stroke="#2b5d9c" stroke-width="1.5"/>
<text x="105" y="72" text-anchor="middle" font-weight="bold">users.test.js</text>
<text x="105" y="96" text-anchor="middle" font-size="12">node --test</text>

<rect x="240" y="40" width="150" height="80" fill="#c6e2ff" stroke="#2b5d9c" stroke-width="1.5"/>
<text x="315" y="72" text-anchor="middle" font-weight="bold">SuperTest</text>
<text x="315" y="96" text-anchor="middle" font-size="12">supertest(app)</text>

<rect x="440" y="40" width="190" height="80" fill="#ff8a8a" stroke="#2b5d9c" stroke-width="1.5"/>
<text x="535" y="66" text-anchor="middle" font-weight="bold">app.js</text>
<text x="535" y="88" text-anchor="middle" font-size="12">routes, middleware,</text>
<text x="535" y="104" text-anchor="middle" font-size="12">error handler</text>

<rect x="680" y="40" width="110" height="80" fill="#ff8a8a" stroke="#2b5d9c" stroke-width="1.5"/>
<text x="735" y="72" text-anchor="middle" font-weight="bold">Mongoose</text>
<text x="735" y="96" text-anchor="middle" font-size="12">models</text>

<!-- Database cylinder -->
<path d="M840,52 v56 a50,12 0 0 0 100,0 v-56" fill="#b8f0b8" stroke="#2b5d9c" stroke-width="1.5"/>
<ellipse cx="890" cy="52" rx="50" ry="12" fill="#b8f0b8" stroke="#2b5d9c" stroke-width="1.5"/>
<text x="890" y="88" text-anchor="middle" font-weight="bold">MongoDB</text>
<text x="890" y="108" text-anchor="middle" font-size="12">my-app-test</text>

<!-- Arrows (both ways: request, then response) -->
<line x1="192" y1="80" x2="238" y2="80" stroke="#000" stroke-width="1.2" marker-start="url(#tail)" marker-end="url(#head)"/>
<line x1="392" y1="80" x2="438" y2="80" stroke="#000" stroke-width="1.2" marker-start="url(#tail)" marker-end="url(#head)"/>
<line x1="632" y1="80" x2="678" y2="80" stroke="#000" stroke-width="1.2" marker-start="url(#tail)" marker-end="url(#head)"/>
<line x1="792" y1="80" x2="838" y2="80" stroke="#000" stroke-width="1.2" marker-start="url(#tail)" marker-end="url(#head)"/>

<!-- Labels above the request path -->
<text x="415" y="15" text-anchor="middle" font-size="12">HTTP request &amp; response</text>
<text x="415" y="31" text-anchor="middle" font-size="12" fill="#2b5d9c">(no server, no port)</text>

<!-- Fixtures and cleanup: the test also uses the models directly -->
<path d="M105,122 V200 H735 V122" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#head)"/>
<text x="420" y="222" text-anchor="middle" font-size="12">before each test: wipe the database, create fixtures</text>
<text x="420" y="240" text-anchor="middle" font-size="12">after the request: check what was saved</text>

<!-- Legend -->
<text x="20" y="276" font-size="12" fill="#2b5d9c">Your application runs as usual, against a separate test database.</text>
</svg>
